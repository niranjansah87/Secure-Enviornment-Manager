# =============================================================================
# Secure Environment Manager V2 — Nginx Host Configuration
# =============================================================================
# Domain:    your-domain.com (replace with actual domain)
# API V2:    127.0.0.1:3001  (NestJS + Fastify)
# Worker:    internal only   (BullMQ, no HTTP exposure)
# Frontend:  127.0.0.1:3000  (Next.js)
# =============================================================================
#
# Installation:
#   sudo cp nginx/sem-v2.conf /etc/nginx/sites-available/sem-v2.conf
#   sudo ln -s /etc/nginx/sites-available/sem-v2.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# TLS (Let's Encrypt):
#   sudo certbot --nginx -d your-domain.com
# =============================================================================

upstream sem_v2_api {
    server 127.0.0.1:3001;
    keepalive 32;
}

upstream sem_v2_frontend {
    server 127.0.0.1:3000;
    keepalive 16;
}

# ─── Rate limiting zones ────────────────────────────────────────────────────
# auth: tight per-IP limit; burst 5 to tolerate a fast password manager submit
limit_req_zone $binary_remote_addr zone=sem_auth:10m    rate=5r/m;
# api: per-IP, burst for SDK batch calls
limit_req_zone $binary_remote_addr zone=sem_api:10m     rate=30r/s;
# general: frontend + static
limit_req_zone $binary_remote_addr zone=sem_general:10m rate=60r/s;

# ─── CORS origin allowlist ──────────────────────────────────────────────────
map $http_origin $cors_origin {
    default "";
    "~^https?://(localhost|127\.0\.0\.1)(:[0-9]+)?$" "$http_origin";
    "~^https://your-domain\.com$"                    "$http_origin";
}

# =============================================================================
# HTTP — redirect to HTTPS
# =============================================================================
server {
    listen 80;
    server_name your-domain.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# =============================================================================
# HTTPS — main server
# =============================================================================
server {
    listen 443 ssl http2;
    server_name your-domain.com;

    # ─── TLS ────────────────────────────────────────────────────────────────
    ssl_certificate     /etc/letsencrypt/live/your-domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 1.1.1.1 valid=300s;
    resolver_timeout 5s;

    # ─── Security headers ───────────────────────────────────────────────────
    server_tokens off;
    add_header X-Frame-Options          "DENY"                             always;
    add_header X-Content-Type-Options   "nosniff"                          always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin"  always;
    add_header Permissions-Policy       "camera=(), microphone=(), geolocation=()" always;
    # Enable once deployed: add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Content-Security-Policy  "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' wss://your-domain.com; frame-ancestors 'none';" always;

    # ─── Performance ────────────────────────────────────────────────────────
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    client_max_body_size 5M;

    # =========================================================================
    # 1. HEALTH — no auth, no rate limit
    # =========================================================================
    location = /api/v1/health {
        proxy_pass http://sem_v2_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        access_log off;
    }

    # =========================================================================
    # 2. AUTH — tightest rate limit
    # =========================================================================
    location ~ ^/api/v1/auth/(login|refresh)$ {
        limit_req zone=sem_auth burst=5 nodelay;

        proxy_pass http://sem_v2_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 10s;

        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin  "$cors_origin" always;
            add_header Access-Control-Allow-Methods "POST, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Content-Type,Authorization" always;
            add_header Access-Control-Max-Age       1728000;
            add_header Content-Type                 "text/plain; charset=UTF-8";
            add_header Content-Length               0;
            return 204;
        }
        add_header Access-Control-Allow-Origin  "$cors_origin" always;
        add_header Access-Control-Allow-Methods "POST, OPTIONS"  always;
        add_header Access-Control-Allow-Headers "Content-Type,Authorization" always;
    }

    # =========================================================================
    # 3. API — all other /api/v1/ routes
    # =========================================================================
    location /api/v1/ {
        limit_req zone=sem_api burst=40 nodelay;

        proxy_pass http://sem_v2_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_buffering off;

        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin  "$cors_origin" always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Content-Type,Authorization,X-Request-ID" always;
            add_header Access-Control-Max-Age       1728000;
            add_header Content-Type                 "text/plain; charset=UTF-8";
            add_header Content-Length               0;
            return 204;
        }
        add_header Access-Control-Allow-Origin  "$cors_origin" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type,Authorization,X-Request-ID" always;
    }

    # =========================================================================
    # 4. METRICS — Prometheus scrape, internal only
    # =========================================================================
    location /metrics {
        proxy_pass http://sem_v2_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        access_log off;
        allow 127.0.0.1;
        allow 10.0.0.0/8;     # internal monitoring network — adjust as needed
        deny all;
    }

    # =========================================================================
    # 5. STATIC ASSETS — aggressive caching for immutable Next.js chunks
    # =========================================================================
    location ~* ^/_next/static/ {
        proxy_pass http://sem_v2_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, immutable";
        gzip_static on;
        access_log off;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp|avif)$ {
        proxy_pass http://sem_v2_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public";
        gzip_static on;
        access_log off;
    }

    # =========================================================================
    # 6. FRONTEND — Next.js (everything else)
    # =========================================================================
    location / {
        limit_req zone=sem_general burst=30 nodelay;

        proxy_pass http://sem_v2_frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }

    # =========================================================================
    # 7. BLOCK — sensitive paths
    # =========================================================================
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~ ^/(data/|\.env|requirements\.txt|pnpm-lock\.yaml|package\.json) {
        deny all;
        access_log off;
        return 404;
    }
}
