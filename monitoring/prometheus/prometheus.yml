global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'sem-backend'
    static_configs:
      - targets: ['api:3001']
    metrics_path: '/metrics'

  - job_name: 'sem-frontend'
    metrics_path: '/api/metrics'
    static_configs:
      - targets: ['frontend:3000']
