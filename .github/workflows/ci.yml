name: CI

on:
  push:
    branches: [main, enhacement]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: sem_v2_test
          POSTGRES_USER: sem_app
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sem_app -d sem_v2_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://sem_app:test_password@localhost:5432/sem_v2_test
      REDIS_URL: redis://localhost:6379
      # Fake keys for CI — generated fresh each run
      SEM_MASTER_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      SEM_TOKEN_HMAC_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared packages
        run: |
          pnpm --filter @sem/types build
          pnpm --filter @sem/crypto build

      - name: Typecheck API
        run: pnpm --filter @sem/api typecheck

      - name: Typecheck Worker
        run: pnpm --filter @sem/worker typecheck

      - name: Unit tests — crypto package
        run: pnpm --filter @sem/crypto test

      - name: Unit tests — API
        run: pnpm --filter @sem/api test

      - name: Run migrations
        run: |
          PGPASSWORD=test_password psql -h localhost -U sem_app -d sem_v2_test \
            -f apps/api/src/infra/database/migrations/0001_initial_schema.sql
          PGPASSWORD=test_password psql -h localhost -U sem_app -d sem_v2_test \
            -f apps/api/src/infra/database/migrations/0002_add_token_lookup_hmac.sql

      - name: Integration tests
        run: pnpm --filter @sem/api test:integration
        env:
          DATABASE_URL: postgresql://sem_app:test_password@localhost:5432/sem_v2_test
          REDIS_URL: redis://localhost:6379

      - name: Security audit
        run: pnpm audit --audit-level=high
        continue-on-error: true

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Build shared packages
        run: |
          pnpm --filter @sem/types build
          pnpm --filter @sem/crypto build
      - name: Lint API
        run: pnpm --filter @sem/api lint
        continue-on-error: true
