version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sem_v2
      POSTGRES_USER: sem_owner
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    secrets:
      - postgres_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sem_owner -d sem_v2"]
      interval: 5s
      timeout: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_READ_SEARCH

  redis:
    image: redis:7-alpine
    command: >
      redis-server
      --requirepass-file /run/secrets/redis_password
      --appendonly yes
      --save 60 1
    volumes:
      - redis_data:/data
    secrets:
      - redis_password
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "$(cat /run/secrets/redis_password)", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  api:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.api
    env_file:
      - ../../apps/api/.env
    environment:
      - DATABASE_URL=postgresql://sem_app:$(cat /run/secrets/sem_app_password)@postgres:5432/sem_v2
      - REDIS_URL=redis://:$(cat /run/secrets/redis_password)@redis:6379
    secrets:
      - sem_app_password
      - sem_master_key
      - sem_token_hmac_key
      - jwt_private_key
      - jwt_public_key
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "3001:3001"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp

  worker:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.worker
    environment:
      - DATABASE_URL=postgresql://sem_app:$(cat /run/secrets/sem_app_password)@postgres:5432/sem_v2
      - REDIS_URL=redis://:$(cat /run/secrets/redis_password)@redis:6379
    secrets:
      - sem_app_password
      - redis_password
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp

volumes:
  postgres_data:
  redis_data:

secrets:
  postgres_password:
    file: ./secrets/postgres_password.txt
  redis_password:
    file: ./secrets/redis_password.txt
  sem_app_password:
    file: ./secrets/sem_app_password.txt
  sem_master_key:
    file: ./secrets/sem_master_key.txt
  sem_token_hmac_key:
    file: ./secrets/sem_token_hmac_key.txt
  jwt_private_key:
    file: ./secrets/jwt_private_key.pem
  jwt_public_key:
    file: ./secrets/jwt_public_key.pem
